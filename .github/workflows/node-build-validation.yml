name: node build and test

on:
  push:
    branches: [ main ]
    paths:
    - 'actions/status-checker/**' # Only run for TypeScript action updates
    - 'actions/preview-link-generator/**' # Only run for TypeScript action updates
  pull_request:
    branches: [ main ]
    paths:
    - 'actions/status-checker/**' # Only run for TypeScript action updates
    - 'actions/preview-link-generator/**' # Only run for TypeScript action updates

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 18
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: ./actions/status-checker/package-lock.json
    - run: |
        cd ./actions/status-checker/
        npm ci
        npm run build --if-present
        npm test
